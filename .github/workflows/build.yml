name: Build APK

# The build itself is shared by every Newt app: see newt-app.yml in
# https://github.com/sec-newt/newt-android-lib. It runs the tests, screenshots,
# accessibility checks, lint, secret scan and permission check, builds the test APK,
# and publishes a signed release from main.

on:
  # Pushes to main build the APK; other branches are checked through their pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newt:
    name: Newt
    uses: sec-newt/newt-android-lib/.github/workflows/newt-app.yml@bbc810a39283566d7c4da6e3e31b325c710c0949 # testing
    # The app's names, used for the test APK and release files. scripts/new-app.sh sets these.
    with:
      app-slug: newt-template
      app-name: Newt Template
    secrets:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    # Publishing a release needs write access; every other job only reads.
    permissions:
      contents: write
      packages: read
